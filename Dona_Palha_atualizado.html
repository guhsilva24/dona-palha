<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dona Palha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: app de celular em coluna única. Topo roxo em degradê com busca sobreposta, atalhos em blocos pastel, abas fixas embaixo e botão de ação flutuante. */
:root{
  --bg:#F6F4FD; --surface:#FFFFFF; --ink:#1F1B3D; --muted:#6C6889; --line:#E8E4F6; --field:#F6F4FD;
  --brand:#5B3FD3; --brand-soft:#EEEAFB; --on-brand:#FFFFFF;
  --hero-a:#4A2BC0; --hero-b:#7656EE; --hero-ink:#FFFFFF;
  --good:#127A50; --good-bg:#DFF4EA; --warn:#8F5B00; --warn-bg:#FFEFC7; --bad:#B72A47; --bad-bg:#FCE3E8;
  --lav-bg:#EEEAFB; --lav-fg:#5B3FD3; --peach-bg:#FDEEE3; --peach-fg:#E8761A;
  --sky-bg:#E5EFFD; --sky-fg:#3478E3; --mint-bg:#E2F5EC; --mint-fg:#1C9F6A;
  --rose-bg:#FCE7EE; --rose-fg:#E04370; --sun-bg:#FFF3D6; --sun-fg:#D99A00;
  --on-tone:#FFFFFF; --shadow:0 6px 18px rgba(80,60,160,.10); --scrim:rgba(20,16,40,.5);
  --font-d:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111F; --surface:#1D1A33; --ink:#EFEDFF; --muted:#A8A4C6; --line:#302C4D; --field:#151227;
    --brand:#A08DFF; --brand-soft:#2A2452; --on-brand:#14102B;
    --hero-a:#2C1A86; --hero-b:#4A35B5;
    --good:#58D6A0; --good-bg:#1A3A2D; --warn:#FFC857; --warn-bg:#3D3216; --bad:#FF8CA3; --bad-bg:#3F1D28;
    --lav-bg:#272150; --lav-fg:#A592FF; --peach-bg:#3A2B25; --peach-fg:#FF9B4E;
    --sky-bg:#1F2D49; --sky-fg:#6FA6FF; --mint-bg:#1B3329; --mint-fg:#4ED39B;
    --rose-bg:#3B2232; --rose-fg:#FF7AA0; --sun-bg:#3A3322; --sun-fg:#FFCB3D;
    --on-tone:#14102B; --shadow:0 6px 18px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13111F; --surface:#1D1A33; --ink:#EFEDFF; --muted:#A8A4C6; --line:#302C4D; --field:#151227;
  --brand:#A08DFF; --brand-soft:#2A2452; --on-brand:#14102B;
  --hero-a:#2C1A86; --hero-b:#4A35B5;
  --good:#58D6A0; --good-bg:#1A3A2D; --warn:#FFC857; --warn-bg:#3D3216; --bad:#FF8CA3; --bad-bg:#3F1D28;
  --lav-bg:#272150; --lav-fg:#A592FF; --peach-bg:#3A2B25; --peach-fg:#FF9B4E;
  --sky-bg:#1F2D49; --sky-fg:#6FA6FF; --mint-bg:#1B3329; --mint-fg:#4ED39B;
  --rose-bg:#3B2232; --rose-fg:#FF7AA0; --sun-bg:#3A3322; --sun-fg:#FFCB3D;
  --on-tone:#14102B; --shadow:0 6px 18px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-b);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero-a);z-index:10}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tone-lav{--tb:var(--lav-bg);--tf:var(--lav-fg)}
.tone-peach{--tb:var(--peach-bg);--tf:var(--peach-fg)}
.tone-sky{--tb:var(--sky-bg);--tf:var(--sky-fg)}
.tone-mint{--tb:var(--mint-bg);--tf:var(--mint-fg)}
.tone-rose{--tb:var(--rose-bg);--tf:var(--rose-fg)}
.tone-sun{--tb:var(--sun-bg);--tf:var(--sun-fg)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* topo */
.hero{background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-bottom-left-radius:34px;padding-top:16px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:600 17px var(--font-d)}
.brand-mark{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.16)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:#7DF0B8}
.sync[data-k="busy"]::before{background:#FFD76A}
.sync[data-k="err"]::before{background:#FF9AAE}
.sync[data-k="local"]::before{background:#C9C2F5}
.hero h1{font:600 27px/1.2 var(--font-d);margin:22px 0 2px;text-wrap:balance}
.hero p{margin:0;font-size:14.5px;opacity:.92}
.search{position:relative;margin-top:20px;margin-bottom:-27px}
.search input{width:100%;height:54px;border-radius:18px;border:0;background:var(--surface);color:var(--ink);padding:0 44px 0 48px;font-size:15px;box-shadow:0 8px 22px rgba(40,20,120,.22)}
.search input::placeholder{color:var(--muted)}
.search .i{position:absolute;left:16px;top:17px;color:var(--brand)}
.search .clear{position:absolute;right:8px;top:8px;width:38px;height:38px;border:0;border-radius:12px;background:none;color:var(--muted);display:grid;place-items:center}
.search .clear[hidden]{display:none}

main{padding-top:50px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 12px}
.sec-h h2{font:600 17px var(--font-d);margin:0}
.link{color:var(--brand);font-weight:700;font-size:14px;background:none;border:0;padding:4px 0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}

/* resumo */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{padding:14px}
.stat-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.stat-h .ic{width:30px;height:30px;border-radius:50%;background:var(--tf);color:var(--on-tone);display:grid;place-items:center}
.stat-h .ic svg{width:16px;height:16px}
.stat-n{font:600 22px/1.2 var(--font-d);margin:10px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat-s{font-size:12.5px;color:var(--muted)}

/* atalhos */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{appearance:none;border:0;text-align:left;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:12px;background:var(--tb);border-radius:20px;padding:14px 12px 12px;min-height:118px;box-shadow:var(--shadow);min-width:0}
.tile .ic{width:40px;height:40px;border-radius:50%;background:var(--tf);color:var(--on-tone);display:grid;place-items:center}
.tile b{font:600 14.5px var(--font-d);display:block}
.tile small{display:flex;justify-content:space-between;align-items:center;gap:4px;color:var(--muted);font-size:11.5px;line-height:1.3;margin-top:2px}
.tile small svg{width:14px;height:14px}
.tile .tt{margin-top:auto}

/* listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{appearance:none;border:0;background:none;width:100%;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;min-width:0}
.row-wrap{display:flex;align-items:center;min-width:0}
.row-wrap .row{flex:1}
.row-m{display:flex;flex-direction:column;min-width:0}
.row-t{font-weight:700;overflow-wrap:anywhere}
.row-s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.row-r b{font:600 14.5px var(--font-d)}
.av{width:40px;height:40px;border-radius:50%;background:var(--tf);color:var(--on-tone);display:grid;place-items:center;font:600 16px var(--font-d);flex:none}
.av.lg{width:46px;height:46px;font-size:18px}
.datechip{width:50px;border-radius:12px;background:var(--brand-soft);color:var(--brand);text-align:center;padding:6px 0;line-height:1.1}
.datechip small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.datechip b{display:block;font:600 19px var(--font-d)}
.datechip span{display:block;font-size:10.5px;opacity:.85}
.chk{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--good);width:40px;height:40px;border-radius:12px;margin-right:12px;display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--brand-soft);color:var(--brand)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.day{font:600 13px var(--font-d);color:var(--muted);margin:20px 0 8px;text-transform:capitalize}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.sumbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px}
.sumbar div{min-width:0}
.sumbar span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sumbar b{font:600 14.5px var(--font-d);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* sabores */
.fl{padding:14px;margin-bottom:12px}
.fl-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.fl h3{font:600 16px var(--font-d);margin:0;overflow-wrap:anywhere}
.fl-sub{font-size:12.5px;color:var(--muted)}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0;padding:10px 12px;border-radius:14px;background:var(--tb)}
.kv3 dt{font-size:11.5px;color:var(--muted);font-weight:600}
.kv3 dd{margin:0;font:600 14.5px var(--font-d);font-variant-numeric:tabular-nums}
.kv3 dd.good{color:var(--good)}
.kv3 dd.bad{color:var(--bad)}
.fl-stock{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* botões e formulários */
.btn{appearance:none;border:1px solid transparent;border-radius:14px;height:48px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fab{position:fixed;z-index:15;bottom:calc(86px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px),calc((100% - 520px)/2 + 16px));height:54px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--brand);color:var(--on-brand);font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(60,30,170,.35)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;font-size:11.5px;font-weight:700;color:var(--muted);text-decoration:none}
.tabbar a[aria-current="page"]{color:var(--brand)}
.field{margin-bottom:14px;min-width:0}
.field label,.field .lbl{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.opt{font-weight:400;color:var(--muted)}
.field input,.field select{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--field);padding:0 14px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px}
.stepper button{border:1px solid var(--line);background:var(--field);border-radius:14px;height:48px;font-size:20px;font-weight:700}
.stepper input{text-align:center}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:4px;border-radius:16px;background:var(--field);border:1px solid var(--line)}
.seg button{border:0;background:none;border-radius:12px;height:42px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 14px;border-radius:16px;background:var(--brand-soft);margin:4px 0 14px}
.sum span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sum b{font:600 18px var(--font-d);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.msg{font-size:13.5px;color:var(--warn);background:var(--warn-bg);padding:10px 12px;border-radius:12px;margin:0 0 14px}
details.calc{margin-bottom:14px;border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
details.calc summary{font-weight:700;color:var(--brand);cursor:pointer}
details.calc .grid2{margin-top:12px}
.calc-out{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.kvlist{margin:0 0 16px;display:grid;gap:0}
.kvlist div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.kvlist dt{color:var(--muted)}
.kvlist dd{margin:0;font-weight:700;text-align:right;overflow-wrap:anywhere}
.actions{display:grid;gap:10px}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-top:20px;font-size:13.5px;color:var(--muted)}
.note .i{color:var(--brand);margin-top:1px}
.note b{color:var(--ink)}
.onboard{padding:18px}
.onboard h2{font:600 18px var(--font-d);margin:0 0 6px}
.onboard p{margin:0 0 14px;color:var(--muted)}
.onboard .actions{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px var(--font-d);margin-bottom:4px}
.empty .btn{margin-top:14px}

/* cálculos automáticos */
.mcard{padding:14px}
.mcard-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mcard-h b{font:600 15px var(--font-d);text-transform:capitalize}
.mnav{display:flex;gap:8px}
.mnav .icon-btn{width:36px;height:36px;border-radius:11px}
.icon-btn[disabled]{opacity:.4;cursor:not-allowed}
.eq{margin:0}
.eq div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.eq div:last-child{border-bottom:0}
.eq dt{color:var(--muted)}
.eq dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.eq .res dt{color:var(--ink);font-weight:700}
.eq .res dd{font:600 19px var(--font-d)}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.big{display:block;font:600 21px/1.25 var(--font-d)}
.bar{height:10px;border-radius:999px;background:var(--brand-soft);overflow:hidden;margin:12px 0 10px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.bar.done i{background:var(--good)}
.mcard p{margin:0;font-size:13.5px;color:var(--muted)}
.mcard p b{color:var(--ink)}
/* período, visão geral e formulário de venda */
.pbar{display:flex;align-items:center;gap:10px;margin:2px 0 2px}
.plabel{font-weight:700;font-size:13.5px;color:var(--muted);flex:none}
.pbar .chips{flex:1;min-width:0;margin:0}
.pnote{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.prange{margin-top:6px}
.stat.wide{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.sbar{display:block;height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--tf);border-radius:99px}
.subline{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:6px}
.subline b{color:var(--ink)}
.pre{position:relative}
.pre>span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.pre>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.pre input{padding-left:42px}
.req{color:var(--bad)}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:16px;background:var(--brand-soft);padding:12px 4px;margin:2px 0 16px}
.sum3>div{text-align:center;padding:0 6px;min-width:0}
.sum3>div+div{border-left:1px solid var(--line)}
.sum3 span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sum3 b{font:600 15.5px var(--font-d);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.paysel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.paysel button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:6px 8px}
.paysel button[aria-pressed="true"].pnow{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.paysel button[aria-pressed="true"].plater{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.formbar{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:6px}
.sh-ic{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.sh-t{flex:1;min-width:0}
.sh-t p{margin:0;font-size:13px;color:var(--muted)}

/* janela de baixo *//* janela de baixo */
#sheet-root{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);max-height:92%;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;animation:up .22s ease-out;outline:0}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 2px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px max(18px,env(safe-area-inset-left,0px)) 6px 20px}
.sheet-h h2{font:600 18px var(--font-d);margin:0}
.sheet-b{padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>

<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div class="brand"><span class="brand-mark" id="logo"></span>Dona Palha</div>
      <span class="sync" id="sync" data-k="busy" role="status">Conectando…</span>
    </div>
    <h1 id="hTitle">Olá, Gustavo</h1>
    <p id="hSub"></p>
    <div class="search">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" autocomplete="off" aria-label="Buscar" placeholder="Buscar venda ou cliente…">
      <button class="clear" id="qclear" type="button" aria-label="Limpar busca" hidden></button>
    </div>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<button class="fab" id="fab" type="button" data-act="fab"></button>

<nav class="tabbar" aria-label="Seções">
  <div class="wrap" id="tabs"></div>
</nav>

<div id="sheet-root" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
var LS_KEY='donapalha:v1';
var $=function(s){return document.querySelector(s);};
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function money(n){return BRL.format(Math.round((n+Number.EPSILON)*100)/100);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){
  var s=String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');
  if(!s) return NaN;
  if(s.indexOf(',')>-1) s=s.replace(/\./g,'').replace(',','.');
  var n=parseFloat(s); return isFinite(n)?n:NaN;
}
function inp(n){return (Math.round(n*100)/100).toFixed(2).replace('.',',');}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
var pad=function(n){return String(n).padStart(2,'0');};
function toStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return toStr(new Date());}
function addDays(s,n){var p=s.split('-').map(Number);return toStr(new Date(p[0],p[1]-1,p[2]+n));}
function diffDays(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5);}
var MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var MESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIA=['dom','seg','ter','qua','qui','sex','sáb'];
var DIAL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function P(s){var p=s.split('-').map(Number);return {y:p[0],m:p[1],d:p[2],w:new Date(p[0],p[1]-1,p[2]).getDay()};}
function dayLabel(s){
  var t=today(); if(s===t) return 'Hoje'; if(s===addDays(t,-1)) return 'Ontem';
  var p=P(s); return DIA[p.w]+', '+pad(p.d)+' '+MES[p.m-1];
}
function shortDate(s){var p=P(s);return pad(p.d)+'/'+pad(p.m);}
function longToday(){var p=P(today());return DIAL[p.w]+', '+p.d+' de '+MESL[p.m-1];}
function greet(){var h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';}

var ICONS={
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  bag:'<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>',
  dollar:'<path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  trend:'<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
  bars:'<path d="M12 20V10M18 20V4M6 20v-4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevl:'<path d="M15 6l-6 6 6 6"/>',
  check:'<path d="M5 12l5 5L20 7"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  layers:'<path d="M12 2l10 5-10 5L2 7z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
  receipt:'<path d="M4 2v20l3-2 3 2 2-2 2 2 3-2 3 2V2l-3 2-3-2-2 2-2-2-3 2z"/><path d="M8 9h8M8 13h8"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  cake:'<path d="M3 21h18"/><path d="M5 21v-8h14v8"/><path d="M4 13a8 3 0 0 1 16 0"/><path d="M12 7V4"/>'
};
function I(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';}

/* ---------- dados ---------- */
var TONES=['lav','peach','sky','mint','rose','sun'];
var LOW=5;
function empty(){return {flavors:[],sales:[],costs:[],productions:[],demo:false,rev:0};}
function norm(d){
  d=d||{};
  var cp=function(a){return Array.isArray(a)?a.map(function(x){return Object.assign({},x);}):[];};
  return {flavors:cp(d.flavors),sales:cp(d.sales),costs:cp(d.costs),productions:cp(d.productions),demo:!!d.demo,rev:Number(d.rev)||0};
}
function hasData(s){return s.flavors.length||s.sales.length||s.costs.length;}
function loadLocal(){try{var r=localStorage.getItem(LS_KEY);if(r) return norm(JSON.parse(r));}catch(e){}return null;}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
var S=loadLocal()||empty();
var view='inicio',Q='',FILTER='todas',keep=false,MONTH=today().slice(0,7);
var VIEWS=['inicio','vendas','geral','sabores','custos'];
var PERIOD='hoje',CFROM=today().slice(0,8)+'01',CTO=today();
var METHODS=['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','Outro'];

function flavorById(id){return S.flavors.filter(function(f){return f.id===id;})[0];}
function stats(){
  var r={fat:0,luc:0,rec:0,pen:0,un:0};
  S.sales.forEach(function(s){
    var t=s.qty*s.price; r.fat+=t; r.luc+=s.qty*(s.price-s.cost); r.un+=s.qty;
    if(s.paid) r.rec+=t; else r.pen+=t;
  });
  r.margem=r.fat>0?r.luc/r.fat:0;
  return r;
}
function sold(fid){return S.sales.reduce(function(a,s){return s.flavorId===fid?a+s.qty:a;},0);}
function costTotal(){return S.costs.reduce(function(a,c){return a+c.total;},0);}
function shiftMonth(ym,d){var p=ym.split('-').map(Number);var dt=new Date(p[0],p[1]-1+d,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1);}
function monthStats(ym){
  var r={fat:0,luc:0,gastos:0};
  S.sales.forEach(function(s){if(s.date.slice(0,7)===ym){r.fat+=s.qty*s.price; r.luc+=s.qty*(s.price-s.cost);}});
  S.costs.forEach(function(c){if(c.date.slice(0,7)===ym) r.gastos+=c.total;});
  r.res=r.fat-r.gastos;
  return r;
}
function equilibrio(){
  var st=stats(),gastos=costTotal(),avg=0;
  if(st.un>0) avg=st.fat/st.un;
  else if(S.flavors.length) avg=S.flavors.reduce(function(a,f){return a+f.price;},0)/S.flavors.length;
  var falta=Math.max(0,gastos-st.fat);
  return {gastos:gastos,fat:st.fat,avg:avg,falta:falta,un:avg>0?Math.ceil(falta/avg):0,pct:gastos>0?Math.min(100,st.fat/gastos*100):0};
}
/* ---------- período ---------- */
function periodRange(){
  var t=today();
  if(PERIOD==='hoje') return [t,t];
  if(PERIOD==='7d') return [addDays(t,-6),t];
  if(PERIOD==='mes'){
    var last=toStr(new Date(Number(t.slice(0,4)),Number(t.slice(5,7)),0));
    return [t.slice(0,7)+'-01',last];
  }
  var a=CFROM||t,b=CTO||t;
  return a<=b?[a,b]:[b,a];
}
function periodLabel(){
  var r=periodRange();
  if(PERIOD==='hoje') return 'Hoje · '+DIAL[P(r[0]).w]+', '+shortDate(r[0]);
  if(PERIOD==='mes'){var p=P(r[0]);return MESL[p.m-1].charAt(0).toUpperCase()+MESL[p.m-1].slice(1)+' de '+p.y;}
  return 'De '+shortDate(r[0])+' a '+shortDate(r[1]);
}
function pstats(){
  var r=periodRange(),o={n:0,un:0,fat:0,custo:0,luc:0,paidN:0,paidV:0,penN:0,penV:0,list:[]};
  S.sales.forEach(function(s){
    if(s.date<r[0]||s.date>r[1]) return;
    var t=s.qty*s.price;
    o.n++; o.un+=s.qty; o.fat+=t; o.custo+=s.qty*s.cost; o.luc+=t-s.qty*s.cost; o.list.push(s);
    if(s.paid){o.paidN++;o.paidV+=t;}else{o.penN++;o.penV+=t;}
  });
  return o;
}

/* ---------- salvar (nuvem + aparelho) ---------- */
var dbDoc=null,dirty=false,writing=false,tmr=null;
function setStatus(k){
  var m={ok:['Salvo','ok'],saving:['Salvando…','busy'],wait:['Conectando…','busy'],local:['Só neste aparelho','local'],err:['Sem sincronizar','err']}[k];
  var el=$('#sync'); el.textContent=m[0]; el.dataset.k=m[1];
}
function commit(){
  S.rev=Date.now(); saveLocal(); render();
  if(dbDoc){dirty=true; setStatus('saving'); schedule();}
}
function schedule(){clearTimeout(tmr); tmr=setTimeout(flush,250);}
async function flush(){
  if(!dbDoc) return;
  if(writing){schedule();return;}
  writing=true;
  var snap=JSON.parse(JSON.stringify(S));
  try{
    await dbDoc.set(snap);
    if(S.rev===snap.rev){dirty=false; setStatus('ok');}
  }catch(e){setStatus('err');}
  finally{writing=false; if(dirty&&S.rev!==snap.rev) schedule();}
}
async function initDb(){
  if(!(window.claude&&window.claude.use)){setStatus('local');return;}
  var db=null,user=null;
  try{var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);db=r[0];user=r[1];}catch(e){}
  if(!db||!user){setStatus('local');return;}
  var id=null; try{id=await user.id();}catch(e){}
  if(!id){setStatus('local');return;}
  dbDoc=db.doc('data/users/'+id+'/state');
  var timer=setTimeout(function(){setStatus('err');},10000);
  dbDoc.onSnapshot(function(snap){
    if(!snap.metadata.fromCache) clearTimeout(timer);
    var d=snap.exists?snap.data():null;
    if(d){
      if(!dirty&&!writing){
        if(Number(d.rev||0)!==S.rev){S=norm(d); saveLocal(); render();}
        setStatus(snap.metadata.fromCache?'wait':'ok');
      }
    }else if(!snap.metadata.fromCache){
      if(hasData(S)){dirty=true; setStatus('saving'); schedule();}
      else setStatus('ok');
    }
  },function(){setStatus('err');});
}

/* ---------- navegação ---------- */
var TITLES={
  inicio:function(){return ['Olá, Gustavo',greet()+' · '+longToday()];},
  vendas:function(){var s=stats();return ['Vendas',S.sales.length+(S.sales.length===1?' venda · ':' vendas · ')+s.un+' un vendidas'];},
  geral:function(){return ['Visão geral',periodLabel()];},
  sabores:function(){var t=S.flavors.reduce(function(a,f){return a+f.stock;},0);return ['Sabores',S.flavors.length+(S.flavors.length===1?' sabor · ':' sabores · ')+t+' un em estoque'];},
  custos:function(){return ['Custos',S.costs.length+(S.costs.length===1?' compra · ':' compras · ')+money(costTotal())+' gastos'];}
};
var PH={inicio:'Buscar venda ou cliente…',vendas:'Buscar venda ou cliente…',geral:'Buscar sabor…',sabores:'Buscar sabor…',custos:'Buscar item…'};
var FABS={inicio:'Nova venda',vendas:'Nova venda',geral:'Nova venda',sabores:'Novo sabor',custos:'Novo custo'};
var TABS=[['inicio','Início','home'],['vendas','Vendas','bag'],['geral','Visão geral','grid'],['sabores','Sabores','layers'],['custos','Custos','receipt']];

function route(){
  var h=location.hash.replace('#','');
  var nv=VIEWS.indexOf(h)>-1?h:'inicio';
  if(nv!==view||!keep){
    if(!keep){Q='';$('#q').value='';}
    if(!keep) FILTER='todas';
  }
  keep=false; view=nv; closeSheet(); render(); window.scrollTo(0,0);
}
function go(name){if(view===name){render();window.scrollTo(0,0);}else location.hash='#'+name;}
window.addEventListener('hashchange',route);

function render(){
  var t=TITLES[view]();
  $('#hTitle').textContent=t[0]; $('#hSub').textContent=t[1];
  $('#q').placeholder=PH[view];
  $('#qclear').hidden=!Q;
  $('#fab').innerHTML=I('plus')+FABS[view];
  $('#tabs').innerHTML=TABS.map(function(x){
    return '<a href="#'+x[0]+'"'+(x[0]===view?' aria-current="page"':'')+'>'+I(x[2])+x[1]+'</a>';
  }).join('');
  renderView();
}
function renderView(){
  var fn={inicio:viewHome,vendas:viewVendas,geral:viewGeral,sabores:viewSabores,custos:viewCustos}[view];
  $('#view').innerHTML=fn();
}

/* ---------- peças de tela ---------- */
function dueInfo(s){
  var d=diffDays(today(),s.due);
  if(d<0) return {c:'bad',t:'Atrasado '+(-d)+(-d===1?' dia':' dias')};
  if(d===0) return {c:'warn',t:'Vence hoje'};
  if(d===1) return {c:'',t:'Amanhã'};
  return {c:'',t:'Em '+d+' dias'};
}
function payPill(s){
  if(s.paid) return '<span class="pill good">Pago</span>';
  var di=dueInfo(s); return '<span class="pill '+di.c+'">'+di.t+'</span>';
}
function toneOf(s){var f=flavorById(s.flavorId);return f?f.tone:'lav';}
function saleRow(s){
  var total=s.qty*s.price;
  return '<button class="row tone-'+toneOf(s)+'" type="button" data-act="sale" data-id="'+s.id+'">'+
    '<span class="av">'+esc((s.flavorName||'?').charAt(0).toUpperCase())+'</span>'+
    '<span class="row-m"><span class="row-t">'+s.qty+'× '+esc(s.flavorName)+'</span>'+
    '<span class="row-s">'+(s.client?esc(s.client)+' · ':'')+money(s.price)+' cada'+(s.method?' · '+esc(s.method):'')+'</span></span>'+
    '<span class="row-r"><b>'+money(total)+'</b>'+payPill(s)+'</span></button>';
}
function pendingRow(s){
  var p=P(s.due),total=s.qty*s.price,di=dueInfo(s);
  return '<div class="row-wrap"><button class="row" type="button" data-act="sale" data-id="'+s.id+'">'+
    '<span class="datechip"><small>'+MES[p.m-1]+'</small><b>'+pad(p.d)+'</b><span>'+DIA[p.w]+'</span></span>'+
    '<span class="row-m"><span class="row-t">'+esc(s.client||s.flavorName)+'</span>'+
    '<span class="row-s">'+s.qty+'× '+esc(s.flavorName)+' · falta receber '+money(total)+(s.method?' · '+esc(s.method):'')+'</span></span>'+
    '<span class="row-r"><span class="pill '+di.c+'">'+di.t+'</span></span></button>'+
    '<button class="chk" type="button" data-act="markPaid" data-id="'+s.id+'" aria-label="Marcar como pago">'+I('check')+'</button></div>';
}
function demoBanner(){
  return '<div class="card note" style="margin:0 0 18px">'+I('info')+'<div><b>Dados de exemplo.</b> Eles servem só para você ver o app funcionando. <button class="link" type="button" data-act="clearDemo">Apagar tudo e começar do zero</button></div></div>';
}
function tile(tone,icon,title,sub,attrs,tag){
  tag=tag||'button';
  return '<'+tag+' class="tile tone-'+tone+'" '+attrs+(tag==='button'?' type="button"':'')+'>'+
    '<span class="ic">'+I(icon)+'</span><span class="tt"><b>'+title+'</b><small><span>'+sub+'</span>'+I('chev')+'</small></span></'+tag+'>';
}

/* ---------- início ---------- */
function periodBar(){
  var opts=[['hoje','Hoje'],['7d','Últimos 7 dias'],['mes','Mês atual'],['custom','Personalizado']];
  var h='<div class="pbar"><span class="plabel">Período</span><div class="chips">'+opts.map(function(o){
    return '<button class="chip" type="button" data-act="period" data-v="'+o[0]+'" aria-pressed="'+(PERIOD===o[0])+'">'+o[1]+'</button>';
  }).join('')+'</div></div>';
  if(PERIOD==='custom'){
    h+='<div class="grid2 prange"><div class="field"><label for="p-from">De</label><input id="p-from" type="date" value="'+esc(CFROM)+'"></div>'+
       '<div class="field"><label for="p-to">Até</label><input id="p-to" type="date" value="'+esc(CTO)+'"></div></div>';
  }else{
    h+='<p class="pnote">'+esc(periodLabel())+'</p>';
  }
  return h;
}
function kpi(tone,icon,label,value,sub){
  return '<div class="card stat tone-'+tone+'"><div class="stat-h"><span class="ic">'+I(icon)+'</span>'+label+'</div><div class="stat-n">'+value+'</div><div class="stat-s">'+sub+'</div></div>';
}
function unidades(n){return n+(n===1?' unidade':' unidades');}
function marg(p){return p.fat>0?Math.round(p.luc/p.fat*100):0;}
function stockList(){
  if(!S.flavors.length) return '<div class="card empty"><b>Nenhum sabor cadastrado</b>Cadastre seus sabores para acompanhar o estoque de cada um.</div>';
  var max=Math.max.apply(null,S.flavors.map(function(f){return f.stock;}).concat([1]));
  return '<div class="list">'+S.flavors.map(function(f){
    return '<button class="row tone-'+f.tone+'" type="button" data-act="editFlavor" data-id="'+f.id+'"><span class="av">'+esc(f.name.charAt(0).toUpperCase())+'</span>'+
      '<span class="row-m"><span class="row-t">'+esc(f.name)+'</span><span class="row-s">Preço '+money(f.price)+' · custo '+money(f.cost)+'</span>'+
      '<span class="sbar"><i style="width:'+Math.round(f.stock/max*100)+'%"></i></span></span>'+
      '<span class="row-r">'+stockPill(f)+'</span></button>';
  }).join('')+'</div>';
}
function viewHome(){
  var p=pstats(),all=stats(),h='';
  var tot=S.flavors.reduce(function(a,f){return a+f.stock;},0);
  var val=S.flavors.reduce(function(a,f){return a+f.stock*f.cost;},0);
  var np=S.sales.filter(function(s){return !s.paid;}).length;
  if(S.demo) h+=demoBanner();
  if(!S.flavors.length){
    h+='<section class="card onboard" style="margin-bottom:18px"><h2>Vamos começar</h2><p>Cadastre seus sabores de palha italiana com preço e custo. Depois é só registrar cada venda.</p>'+
       '<div class="actions"><button class="btn primary" type="button" data-act="newFlavor">'+I('plus')+'Cadastrar sabor</button>'+
       '<button class="btn" type="button" data-act="demo">Ver com exemplo</button></div></section>';
  }
  h+=periodBar();
  h+='<div class="stats">'+
    kpi('lav','bars','Faturamento',money(p.fat),'Recebido '+money(p.paidV))+
    kpi('mint','trend','Lucro',money(p.luc),'Margem de '+marg(p)+'%')+
    kpi('peach','bag','Vendas realizadas',String(p.n),p.n===1?'1 venda no período':p.n+' vendas no período')+
    kpi('sky','layers','Palhas vendidas',unidades(p.un),'no período')+
    kpi('rose','receipt','Custo total',money(p.custo),'das palhas vendidas')+
    kpi('sun','box','Estoque disponível',unidades(tot),'Custo em estoque '+money(val))+
    kpi('mint','check','Vendas pagas',String(p.paidN),money(p.paidV)+' recebidos')+
    kpi('peach','clock','Vendas pendentes',String(p.penN),money(p.penV)+' no período')+

function eqCard(){

function stockPill(f){
  if(f.stock<=0) return '<span class="pill bad">Sem estoque</span>';

  return '<span class="pill good">'+f.stock+' un em estoque</span>';
}

function openSale(preId){

  var body='<form id="f-sale" novalidate>'+
    '<div class="field"><label for="s-flavor">Sabor da palha italiana <span class="req">*</span></label><select id="s-flavor">'+saleOptions(f0.id)+'</select>'+

    '<div class="field"><label for="s-price">Preço unitário (R$) <span class="req">*</span></label><div class="pre"><span>R$</span><input id="s-price" inputmode="decimal" value="'+inp(f0.price)+'"></div></div></div>'+
    '<div class="sum3"><div><span>Valor total</span><b id="s-total"></b></div><div><span>Custo total</span><b id="s-cost"></b></div><div><span>Lucro estimado</span><b id="s-profit"></b></div></div>'+
    '<div class="grid2"><div class="field"><label for="s-client">Nome do cliente <span class="opt">(opcional)</span></label><div class="pre">'+I('user')+'<input id="s-client" autocomplete="off" placeholder="Ex.: Mariana Silva"></div></div>'+
    '<div class="field"><label for="s-phone">WhatsApp / Tel <span class="opt">(opcional)</span></label><input id="s-phone" inputmode="tel" autocomplete="off" placeholder="Ex.: 11999998888"></div></div>'+
    '<div class="field"><span class="lbl">Situação do pagamento <span class="req">*</span></span><div class="paysel">'+
    '<button type="button" class="pnow" data-pay="now" aria-pressed="true">'+I('dollar')+'1. Pago na hora</button>'+
    '<button type="button" class="plater" data-pay="later" aria-pressed="false">'+I('clock')+'2. Pagamento futuro</button></div></div>'+
    '<div class="field" id="s-due-wrap" hidden><label for="s-due">Vai pagar em que dia? <span class="req">*</span></label><input id="s-due" type="date" value="'+addDays(today(),7)+'">'+
    '<p class="hint">A venda fica em “falta receber” até você marcar como paga.</p></div>'+
    '<div class="grid2"><div class="field"><label for="s-method" id="s-method-l">Forma de pagamento</label><select id="s-method">'+methodOptions('Pix')+'</select></div>'+
    '<div class="field"><label for="s-date">Data da venda</label><input id="s-date" type="date" value="'+today()+'"></div></div>'+
    '<div class="field"><label for="s-notes">Observações <span class="opt">(opcional)</span></label><input id="s-notes" autocomplete="off" placeholder="Ex.: embalagem para presente, entrega às 16h"></div>'+
    '<p class="msg" id="s-warn" hidden></p>'+
    '<div class="formbar"><button class="btn" type="button" data-act="closeSheet">Cancelar</button><button class="btn primary" type="submit" id="s-save">Salvar venda</button></div></form>';
  openSheet('Registrar venda',body,function(b){
    var pay='now';
    var g=function(id){return b.querySelector('#'+id);};
    function calc(){
      var f=flavorById(g('s-flavor').value),q=parseInt(g('s-qty').value,10),p=num(g('s-price').value);
      g('s-stock').innerHTML='Estoque atual: <b>'+f.stock+' un</b>';
      g('s-ucost').textContent='Custo prod.: '+money(f.cost)+' / un';
      var okq=q>=1,okp=p>=0,t=okq&&okp?q*p:0,c=okq?q*f.cost:0,lu=t-c;
      g('s-total').textContent=money(t); g('s-cost').textContent=money(c);
      var pe=g('s-profit'); pe.textContent=money(lu); pe.className=lu>=0?'pos':'neg';
      var msg='';
      if(!okq) msg='Informe uma quantidade de 1 ou mais.';
      else if(!okp) msg='Informe o preço unitário.';
      else if(q>f.stock) msg='Estoque insuficiente: restam '+f.stock+' un de '+f.name+'. Use Produzir para repor.';
      else if(pay==='later'&&!g('s-due').value) msg='Informe o dia em que o cliente vai pagar.';
      var w=g('s-warn'); w.hidden=!msg; w.textContent=msg; g('s-save').disabled=!!msg;

    g('s-flavor').addEventListener('change',function(){var f=flavorById(this.value);g('s-price').value=inp(f.price);calc();});
    ['s-qty','s-price','s-due'].forEach(function(id){g(id).addEventListener('input',calc);});

    });});
    b.querySelectorAll('[data-pay]').forEach(function(btn){btn.addEventListener('click',function(){
      pay=btn.dataset.pay;
      b.querySelectorAll('[data-pay]').forEach(function(x){x.setAttribute('aria-pressed',String(x===btn));});
      g('s-due-wrap').hidden=pay!=='later';
      g('s-method-l').textContent=pay==='later'?'Vai pagar com':'Forma de pagamento';
      calc();
    });});
    g('f-sale').addEventListener('submit',function(e){

      var f=flavorById(g('s-flavor').value),q=parseInt(g('s-qty').value,10),p=num(g('s-price').value);
      var date=g('s-date').value||today();
      var sale={id:uid(),ts:Date.now(),date:date,flavorId:f.id,flavorName:f.name,qty:q,price:p,cost:f.cost,

        paid:pay==='now',due:pay==='later'?g('s-due').value:'',paidAt:pay==='now'?date:''};
      f.stock-=q; S.sales.push(sale); commit(); closeSheet();
      toast(pay==='now'?'Venda registrada':'Falta receber '+money(q*p)+' em '+shortDate(sale.due));
    });
    calc();
  },{icon:'bag',sub:'Dona Palha · Palha Italiana Artesanal'});
}
function openSaleDetail(id){

    rows.push(['Situação','Pago'+(s.paidAt?' em '+shortDate(s.paidAt):'')]);
    rows.push(['Forma de pagamento',esc(s.method||'—')]);
  }else{
    rows.push(['Situação','Falta receber '+money(total)]);
    rows.push(['Vai pagar em',esc(shortDate(s.due))+' · '+esc(dueInfo(s).t)]);
    rows.push(['Vai pagar com',esc(s.method||'A combinar')]);
  }
  if(s.notes) rows.push(['Observações',esc(s.notes)]);
  var body='<dl class="kvlist">'+rows.map(function(r){return '<div><dt>'+r[0]+'</dt><dd>'+r[1]+'</dd></div>';}).join('')+'</dl>'+
    (s.paid?'':'<div class="field"><label for="d-method">Recebido por</label><select id="d-method">'+methodOptions(s.method||'Pix')+'</select></div>')+
    '<div class="actions">'+
    (s.paid?'<button class="btn" type="button" id="d-unpay">Voltar para “falta receber”</button>':'<button class="btn primary" type="button" id="d-pay">'+I('check')+'Marcar como pago</button>')+
    '<button class="btn danger" type="button" id="d-del">Excluir venda</button></div>';
  openSheet('Venda',body,function(b){
    var pay=b.querySelector('#d-pay'),un=b.querySelector('#d-unpay');
    if(pay) pay.addEventListener('click',function(){markPaid(id,b.querySelector('#d-method').value);closeSheet();});
    if(un) un.addEventListener('click',function(){
      s.paid=false; s.paidAt=''; if(!s.due) s.due=addDays(today(),7); commit(); closeSheet(); toast('Venda voltou para “falta receber”');
    });
    armDelete(b.querySelector('#d-del'),function(){
      var f=flavorById(s.flavorId); if(f) f.stock+=s.qty;
      S.sales=S.sales.filter(function(x){return x.id!==id;}); commit(); closeSheet(); toast('Venda excluída e estoque devolvido');
    });
  });
}
function markPaid(id,method){
  var s=S.sales.filter(function(x){return x.id===id;})[0]; if(!s) return;
  s.paid=true; s.paidAt=today(); if(method) s.method=method; commit(); toast('Pagamento registrado');
}

/* sabor */
function openFlavor(id){
  var f=id?flavorById(id):null;
  var body='<form id="f-fl" novalidate>'+
    '<div class="field"><label for="f-name">Nome do sabor</label><input id="f-name" autocomplete="off" placeholder="Ex.: Tradicional, Ninho, Maracujá" value="'+(f?esc(f.name):'')+'"></div>'+
    '<div class="field"><label for="f-price">Preço de venda (por palha)</label><div class="pre"><span>R$</span><input id="f-price" inputmode="decimal" placeholder="0,00" value="'+(f?inp(f.price):'')+'"></div></div>'+
    '<div class="sum3"><div><span>Custo por palha</span><b id="f-ucost">'+(f?money(f.cost):'Aguardando')+'</b></div><div><span>Lucro por palha</span><b id="f-uprofit">—</b></div><div><span>Margem</span><b id="f-margin">—</b></div></div>'+
    '<p class="hint" style="margin:-6px 0 14px">O custo será calculado automaticamente quando você registrar uma produção, usando os ingredientes e o rendimento da fornada.</p>'+
    '<div class="field"><label for="f-stock">Quantidade em estoque</label><input id="f-stock" inputmode="numeric" value="'+(f?f.stock:0)+'"></div>'+
    '<p class="msg" id="f-warn" hidden></p>'+
    '<div class="actions"><button class="btn primary block" type="submit">'+(f?'Salvar sabor':'Cadastrar sabor')+'</button>'+(f?'<button class="btn danger" type="button" id="f-del">Excluir sabor</button>':'')+'</div></form>';
  openSheet(f?'Editar sabor':'Novo sabor',body,function(b){
    var g=function(i){return b.querySelector('#'+i);};
    function calc(){
      var p=num(g('f-price').value),c=f?Number(f.cost)||0:0,lu=p-c;
      g('f-ucost').textContent=f?money(c):'Calculado na produção';
      g('f-uprofit').textContent=p>=0&&f?money(lu):'—';
      g('f-uprofit').className=lu>=0?'pos':'neg';
      g('f-margin').textContent=p>0&&f?Math.round(lu/p*100)+'%':'—';
    }
    g('f-price').addEventListener('input',calc); calc();
    g('f-fl').addEventListener('submit',function(e){
      e.preventDefault();
      var name=g('f-name').value.trim(),price=num(g('f-price').value),stock=parseInt(g('f-stock').value,10);
      var msg=!name?'Informe o nome do sabor.':!(price>=0)?'Informe o preço de venda.':!(stock>=0)?'Informe o estoque (pode ser 0).':'';
      var w=g('f-warn'); w.hidden=!msg; w.textContent=msg; if(msg) return;
      if(f){f.name=name;f.price=price;f.stock=stock;
        S.sales.forEach(function(s){if(s.flavorId===f.id) s.flavorName=name;});}
      else S.flavors.push({id:uid(),name:name,price:price,cost:0,stock:stock,tone:TONES[S.flavors.length%TONES.length]});
      commit(); closeSheet(); toast(f?'Sabor atualizado':'Sabor cadastrado');
    });
    var del=g('f-del');
    if(del) armDelete(del,function(){
      S.flavors=S.flavors.filter(function(x){return x.id!==f.id;}); commit(); closeSheet(); toast('Sabor excluído');
    });
  });
}
function openProduce(preId){
  if(!S.flavors.length){toast('Cadastre um sabor primeiro'); openFlavor(); return;}
  if(!S.costs.length){toast('Cadastre primeiro os ingredientes em Custos'); go('custos'); return;}
  var f0=flavorById(preId)||S.flavors[0], rows=[{costId:String(S.costs[0].id),qty:''}];
  function ingredientOptions(selected){
    return S.costs.map(function(c){
      return '<option value="'+esc(c.id)+'"'+(String(c.id)===String(selected)?' selected':'')+'>'+esc(c.item)+' — '+money(c.total/c.qty)+' por unidade</option>';
    }).join('');
  }
  function rowHtml(r,i){
    return '<div class="card" style="padding:12px;margin:0 0 10px" data-ing-row="'+i+'">'+
      '<div class="field"><label>Ingrediente '+(i+1)+'</label><select data-ing-cost>'+ingredientOptions(r.costId)+'</select></div>'+
      '<div class="field" style="margin-bottom:0"><label>Quantidade utilizada</label><input data-ing-qty inputmode="decimal" placeholder="Ex.: 2 (kg, caixas, pacotes...)" value="'+esc(r.qty)+'"></div>'+
      '<div class="subline"><span>Custo deste ingrediente</span><b data-ing-total>R$ 0,00</b></div></div>';
  }
  var body='<form id="f-prod" novalidate><div class="field"><label for="p-flavor">Sabor</label><select id="p-flavor">'+flavorOptions(f0.id)+'</select></div>'+
    '<div class="sec-h" style="margin-top:8px"><h2>Ingredientes da fornada</h2></div>'+
    '<p class="hint" style="margin:0 0 12px">Selecione os produtos cadastrados em Custos e informe quanto de cada um foi usado. O sistema calcula o custo proporcional automaticamente.</p>'+
    '<div id="p-ingredients">'+rows.map(rowHtml).join('')+'</div>'+
    '<button class="btn block" id="p-add-ing" type="button" style="margin-bottom:14px">+ Adicionar ingrediente</button>'+
    '<div class="field"><label for="p-qty">Quantas palhas essa fornada produziu?</label><input id="p-qty" inputmode="numeric" placeholder="Ex.: 40"></div>'+
    '<div class="sum3"><div><span>Custo total da fornada</span><b id="p-lot">—</b></div><div><span>Custo por palha</span><b id="p-unit">—</b></div><div><span>Lucro por palha</span><b id="p-profit">—</b></div></div>'+
    '<div class="sum" style="grid-template-columns:1fr 1fr"><div><span>Faturamento previsto</span><b id="p-revenue">—</b></div><div><span>Lucro previsto</span><b id="p-lot-profit">—</b></div></div>'+
    '<p class="hint" id="p-hint" style="margin:-4px 0 14px">O preço de venda cadastrado será usado para calcular o faturamento e o lucro. Ele não será somado ao custo de produção.</p>'+
    '<p class="msg" id="p-warn" hidden></p><button class="btn primary block" type="submit">Registrar produção e atualizar estoque</button></form>';
  openSheet('Nova produção',body,function(b){
    var g=function(i){return b.querySelector('#'+i);};
    function getCalc(){
      var total=0,valid=true;
      b.querySelectorAll('[data-ing-row]').forEach(function(el){
        var id=el.querySelector('[data-ing-cost]').value,q=num(el.querySelector('[data-ing-qty]').value);
        var c=S.costs.filter(function(x){return String(x.id)===String(id);})[0];
        var line=c&&q>0?(c.total/c.qty)*q:0;
        if(!(q>0)||!c) valid=false;
        total+=line;
        el.querySelector('[data-ing-total]').textContent=money(line);
      });
      var qty=parseInt(g('p-qty').value,10),f=flavorById(g('p-flavor').value),ok=valid&&qty>=1&&total>=0;
      var unit=ok?total/qty:NaN,profit=ok?f.price-unit:NaN;
      g('p-lot').textContent=valid?money(total):'—';
      g('p-unit').textContent=ok?money(unit):'—';
      g('p-profit').textContent=ok?money(profit):'—';
      g('p-revenue').textContent=ok?money(qty*f.price):'—';
      g('p-lot-profit').textContent=ok?money(qty*profit):'—';
      g('p-hint').textContent='Preço de venda: '+money(f.price)+' por palha. O custo por palha é o custo proporcional dos ingredientes dividido por '+(qty>=1?qty:'a quantidade produzida')+'.';
      return {total:total,qty:qty,unit:unit,valid:ok,f:f,profit:profit};
    }
    function bindRows(){
      b.querySelectorAll('[data-ing-cost],[data-ing-qty]').forEach(function(el){
        el.oninput=getCalc; el.onchange=getCalc;
      });
      getCalc();
    }
    g('p-add-ing').addEventListener('click',function(){
      rows.push({costId:String(S.costs[0].id),qty:''});
      g('p-ingredients').insertAdjacentHTML('beforeend',rowHtml(rows[rows.length-1],rows.length-1));
      bindRows();
    });
    g('p-qty').addEventListener('input',getCalc);
    g('p-flavor').addEventListener('change',getCalc);
    bindRows();
    g('f-prod').addEventListener('submit',function(e){
      e.preventDefault();
      var r=getCalc(),w=g('p-warn');
      if(!r.valid){w.hidden=false;w.textContent='Informe a quantidade utilizada de cada ingrediente e quantas palhas foram produzidas.';return;}
      var oldStock=Number(r.f.stock)||0,oldCost=Number(r.f.cost)||0;
      r.f.cost=oldStock>0?((oldStock*oldCost)+r.total)/(oldStock+r.qty):r.unit;
      r.f.batchCost=r.total;r.f.batchUnits=r.qty;r.f.stock=oldStock+r.qty;
      if(!Array.isArray(S.productions)) S.productions=[];
      S.productions.push({id:uid(),date:today(),flavorId:r.f.id,flavorName:r.f.name,qty:r.qty,batchCost:r.total,unitCost:r.unit,sellingPrice:r.f.price,ingredients:Array.from(b.querySelectorAll('[data-ing-row]')).map(function(el){
        var c=S.costs.filter(function(x){return String(x.id)===String(el.querySelector('[data-ing-cost]').value);})[0];
        var q=num(el.querySelector('[data-ing-qty]').value);
        return {costId:c.id,item:c.item,qty:q,unitCost:c.total/c.qty,total:(c.total/c.qty)*q};
      })});
      commit();closeSheet();toast('Produção registrada · custo por palha '+money(r.unit));
    });
  });
}
/* custo */
function openCost(id){
  var c=id?S.costs.filter(function(x){return x.id===id;})[0]:null;
  var body='<form id="f-cost-form" novalidate><div class="field"><label for="k-item">Item comprado</label><input id="k-item" autocomplete="off" placeholder="Ex.: Chocolate em barra, embalagem" value="'+(c?esc(c.item):'')+'"></div>'+
    '<div class="grid2"><div class="field"><label for="k-qty">Quantidade</label><input id="k-qty" inputmode="numeric" placeholder="0" value="'+(c?c.qty:'')+'"></div>'+
    '<div class="field"><label for="k-total">Valor total pago</label><input id="k-total" inputmode="decimal" placeholder="0,00" value="'+(c?inp(c.total):'')+'"></div></div>'+
    '<div class="field"><label for="k-date">Data da compra</label><input id="k-date" type="date" value="'+(c?c.date:today())+'"></div>'+
    '<div class="sum" style="grid-template-columns:1fr"><div><span>Custo por item</span><b id="k-unit">R$ 0,00</b></div></div>'+
    '<p class="msg" id="k-warn" hidden></p>'+
    '<div class="actions"><button class="btn primary block" type="submit">'+(c?'Salvar custo':'Registrar custo')+'</button>'+(c?'<button class="btn danger" type="button" id="k-del">Excluir custo</button>':'')+'</div></form>';
  openSheet(c?'Editar custo':'Novo custo',body,function(b){
    var g=function(i){return b.querySelector('#'+i);};
    function calc(){var q=parseFloat(String(g('k-qty').value).replace(',','.')),t=num(g('k-total').value);g('k-unit').textContent=q>0&&t>=0?money(t/q):'R$ 0,00';}
    g('k-qty').addEventListener('input',calc); g('k-total').addEventListener('input',calc); calc();
    g('f-cost-form').addEventListener('submit',function(e){
      e.preventDefault();
      var item=g('k-item').value.trim(),q=parseFloat(String(g('k-qty').value).replace(',','.')),t=num(g('k-total').value),d=g('k-date').value||today();
      var msg=!item?'Informe o nome do item.':!(q>0)?'Informe a quantidade comprada.':!(t>=0)?'Informe o valor total pago.':'';
      var w=g('k-warn'); w.hidden=!msg; w.textContent=msg; if(msg) return;
      if(c){c.item=item;c.qty=q;c.total=t;c.date=d;}
      else S.costs.push({id:uid(),ts:Date.now(),item:item,qty:q,total:t,date:d});
      commit(); closeSheet(); toast(c?'Custo atualizado':'Custo registrado');
    });
    var del=g('k-del');
    if(del) armDelete(del,function(){S.costs=S.costs.filter(function(x){return x.id!==c.id;}); commit(); closeSheet(); toast('Custo excluído');});
  });
}

/* exemplo */
function loadDemo(){
  var t=today(),mk=function(n,p,c,s,i){return {id:uid(),name:n,price:p,cost:c,stock:s,tone:TONES[i]};};
  var f=[mk('Tradicional',6,2.8,18,0),mk('Ninho com morango',7,3.4,4,1),mk('Doce de leite',6.5,3,0,2),mk('Maracujá',7,3.2,12,3)];
  var ts=Date.now();
  var sale=function(off,fi,q,client,paid,dueOff){
    var fl=f[fi],date=addDays(t,off);
    return {id:uid(),ts:ts+(off*1000),date:date,flavorId:fl.id,flavorName:fl.name,qty:q,price:fl.price,cost:fl.cost,client:client,phone:'',method:paid?'Pix':'Dinheiro',notes:'',paid:paid,due:paid?'':addDays(t,dueOff),paidAt:paid?date:''};
  };
  S={flavors:f,sales:[sale(-6,0,6,'Maria',true),sale(-5,1,4,'',true),sale(-3,0,10,'Dona Célia',false,-1),sale(-2,2,5,'Pedro',true),sale(-1,3,3,'João do trabalho',false,3),sale(0,1,2,'',true)],
    costs:[{id:uid(),ts:ts,item:'Chocolate em barra',qty:2,total:52,date:addDays(t,-7)},{id:uid(),ts:ts+1,item:'Biscoito maisena',qty:6,total:21,date:addDays(t,-7)},
      {id:uid(),ts:ts+2,item:'Leite condensado',qty:10,total:68,date:addDays(t,-6)},{id:uid(),ts:ts+3,item:'Caixinhas de embalagem',qty:50,total:35,date:addDays(t,-4)}],
    demo:true,rev:0};
  commit(); toast('Exemplo carregado');
}
function clearAll(){S=empty(); commit(); toast('Tudo limpo. Pode começar!');}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='closeSheet') closeSheet();
  else if(a==='openSale') openSale();
  else if(a==='fab'){ if(view==='sabores') openFlavor(); else if(view==='custos') openCost(); else openSale(); }
  else if(a==='sale') openSaleDetail(id);
  else if(a==='markPaid') markPaid(id);
  else if(a==='editFlavor') openFlavor(id);
  else if(a==='newFlavor') openFlavor();
  else if(a==='newCost') openCost();
  else if(a==='produce') openProduce(id);
  else if(a==='cost') openCost(id);
  else if(a==='filter'){FILTER=el.dataset.v; renderView();}
  else if(a==='goPending'){FILTER='pendentes'; keep=true; if(view==='vendas'){keep=false;render();window.scrollTo(0,0);} else location.hash='#vendas';}
  else if(a==='period'){PERIOD=el.dataset.v; renderView();}
  else if(a==='mprev'){MONTH=shiftMonth(MONTH,-1); renderView();}
  else if(a==='mnext'){if(MONTH<today().slice(0,7)){MONTH=shiftMonth(MONTH,1); renderView();}}
  else if(a==='demo') loadDemo();
  else if(a==='clearDemo') clearAll();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet-root').hidden) closeSheet();});
document.addEventListener('change',function(e){
  if(e.target.id==='p-from'){CFROM=e.target.value||CFROM; renderView();}
  else if(e.target.id==='p-to'){CTO=e.target.value||CTO; renderView();}
});
$('#q').addEventListener('input',function(e){
  Q=e.target.value; $('#qclear').hidden=!Q;
  if(view==='inicio'&&Q){keep=true; location.hash='#vendas';} else renderView();
});
$('#qclear').addEventListener('click',function(){Q='';$('#q').value='';$('#qclear').hidden=true;renderView();$('#q').focus();});

/* ---------- início ---------- */
$('#logo').innerHTML=I('layers');
$('#qclear').innerHTML=I('x');
(function(){var h=location.hash.replace('#','');view=VIEWS.indexOf(h)>-1?h:'inicio';})();
render();
initDb();
})();
</script>
